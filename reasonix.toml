allow = ["Bash=cd /d/Project/GitProject/linshe-marketplace-miniapp && gh pr create --draft --base codex/task-line-ending-normalization --head codex/task-visual-upgrade --title \"visual: 商品图素材 + 品牌视觉升级（作品集）\" --body \"## 关联授权\n\n当前会话明确人类授权（作品集视觉升级方向①）：用户多次指示「继续」，并明确变更图片来源方向为「由无版权素材网站获取并记录来源」。\n\n## Depends on\n\n- Closes 依赖链：#13（行尾符归一化基线）——本 PR 以其 bookmark 为 base，合并前保持 Draft\n\n## 实现结果\n\n1. **商品图真实化**：19 件商品图从 Emoji 文本升级为真实素材（Wikimedia Commons 自由许可，480px），`images/goods/SOURCES.md` 完整记录标题/作者/许可证/原图链接（CC0 / CC BY / CC BY-SA 均合规）\n2. **双层渲染**：8 处商品图位置改为 \\`<image>\\` + Emoji 兜底（无 src 时显示 Emoji，新发布商品封面占位）\n3. **品牌 IP**：程序化生成绿色小屋 logo（\\`scripts/generate-assets.js\\`，Node 内置 zlib 手写 PNG），接入登录页 / 首页 hero / 个人中心会员卡\n4. **空态补齐**：首页搜索无结果 / 收藏空 / 筛选无结果（统一插画 + 文案 + 行动按钮）\n5. **加载态**：首页商品流骨架屏（shimmer 动画，模拟 400ms 异步加载）\n6. **可复现脚本**：\\`scripts/fetch-stock-images.js\\`（素材获取 + 来源记录）、\\`scripts/generate-assets.js\\`（品牌资产）\n\n## 验证证据\n\n\\`bash scripts/check.sh\\` → \\`Lin She mini program check passed.\\` + \\`linshe-marketplace-miniapp project validation passed.\\`（改动全程逐阶段校验通过）\nReview 工具审查通过（双层结构一致性、CSS 无破坏、数据层匹配、三态分支互斥）。\n\n## 已知限制 / 未覆盖\n\n- 素材为演示图（部分教材/人像类与商品描述近似匹配，非商业实拍）\n- 消息会话缩略块、社区动态图保留 Emoji 风格（社交上下文，非商品图）\n- 无订单列表页，\\`empty-order.png\\` 暂未在页面引用\n- 视觉改动在 \\`codex/task-visual-upgrade\\` bookmark，与归一化基线（#13）分开，可由人类分别 Squash Merge\" 2>&1", "Bash=cd /d/Project/GitProject/linshe-marketplace-miniapp && gh pr edit 14 --body-file .pr14-body.md 2>&1 && rm .pr14-body.md && echo \"===验证 body===\" && gh pr view 14 --json body,isDraft,baseRefName,headRefName 2>&1 | python -c \"import json,sys; d=json.load(sys.stdin); print('base:', d['baseRefName'], '| head:', d['headRefName'], '| draft:', d['isDraft']); print('body 含 SOURCES.md:', 'images/goods/SOURCES.md' in d['body'])\""]

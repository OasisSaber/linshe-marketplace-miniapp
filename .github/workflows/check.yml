name: Check

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read # Required only for checkout; PR data comes from the event payload.

jobs:
  check:
    name: check
    permissions:
      contents: read
    uses: OasisSaber/TheMasterplan/.github/workflows/aw-check.yml@v1
    with:
      project-check-path: scripts/check.sh
